<header class="encabezado">
    <h1 data-testid="titulo-app" class="encabezado__marca">{{nombreApp}}</h1>
    <p class="encabezado__eslogan">{{esLogan}}</p>
    <nav class="encabezado__nav">
        <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
        <a routerLink="/mascotas" routerLinkActive="activo">Mascotas</a>
        <a routerLink="/mi-lista" routerLinkActive="activo">Mi lista <span class="encabezado__contador" data-testid="contador-favoritas">{{
                favoritos.total()}}</span></a>
    </nav>
</header>
